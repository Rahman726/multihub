<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Hub - QuizAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: #666;
            margin-top: 10px;
            font-size: 1rem;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        .error {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }

        /* App Selection Styles */
        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .app-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .app-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .app-name {
            font-weight: 700;
            font-size: 1rem;
            color: #333;
        }

        .app-desc {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .user-bar span {
            font-weight: 600;
            color: #333;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Screen -->
        <div class="card" id="authScreen">
            <div class="logo">
                <h1>🚀 App Hub</h1>
                <p>Your collection of amazing apps</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab">Login</button>
                <button class="auth-tab" id="signupTab">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary">Login 🚪</button>
                <p class="error hidden" id="loginError"></p>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="hidden">
                <div class="form-group">
                    <label>Username (3-20 chars)</label>
                    <input type="text" id="signupUsername" required placeholder="Choose username" minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label>Password (4+ chars)</label>
                    <input type="password" id="signupPassword" required placeholder="Choose password" minlength="4">
                </div>
                <button type="submit" class="btn btn-primary">Create Account ✨</button>
                <p class="error hidden" id="signupError"></p>
            </form>
        </div>

        <!-- App Selection Screen -->
        <div class="card hidden" id="appSelectionScreen">
            <div class="user-bar">
                <span>Hi, <b id="userName"></b> 👋</span>
                <button class="logout-btn" id="logoutBtn">Log Out</button>
            </div>

            <div class="logo">
                <h1>🚀 App Hub</h1>
                <p>Choose an app to get started</p>
            </div>

            <div class="app-grid">
                <div class="app-card" onclick="openApp('quiz')">
                    <div class="app-icon">⚡</div>
                    <div class="app-name">Speedy Quiz</div>
                    <div class="app-desc">Fast-paced quiz game</div>
                </div>

                <div class="app-card" onclick="openApp('quran')">
                    <div class="app-icon">🕌</div>
                    <div class="app-name">Islamic App</div>
                    <div class="app-desc">Quran, Hadith, Namaz</div>
                </div>

                <div class="app-card" onclick="openApp('photostore')">
                    <div class="app-icon">📸</div>
                    <div class="app-name">Photo Store</div>
                    <div class="app-desc">Unlimited photos</div>
                </div>

                <div class="app-card" onclick="openApp('photoai')">
                    <div class="app-icon">✨</div>
                    <div class="app-name">Photo With AI</div>
                    <div class="app-desc">AI image generation</div>
                </div>

                <div class="app-card" onclick="openApp('ai-chat')">
                    <div class="app-icon">🤖</div>
                    <div class="app-name">AI Chat</div>
                    <div class="app-desc">Chat with local Ollama AI</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const authScreen = document.getElementById('authScreen');
        const appSelectionScreen = document.getElementById('appSelectionScreen');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    showAppSelection(data.username);
                } else {
                    document.getElementById('loginError').textContent = data.detail || 'Login failed';
                    document.getElementById('loginError').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('loginError').textContent = 'Connection error';
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        // Signup
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    showAppSelection(data.username);
                } else {
                    document.getElementById('signupError').textContent = data.detail || 'Signup failed';
                    document.getElementById('signupError').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('signupError').textContent = 'Connection error';
                document.getElementById('signupError').classList.remove('hidden');
            }
        });

        function showAppSelection(username) {
            document.getElementById('userName').textContent = username;
            authScreen.classList.add('hidden');
            appSelectionScreen.classList.remove('hidden');
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            appSelectionScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            loginForm.reset();
            signupForm.reset();
        });// Open App in current window (same tab)
        function openApp(appType) {
            const token = localStorage.getItem('token');
            let url;

            switch(appType) {
                case 'quiz': url = '/quiz/'; break;
                case 'quran': url = '/quran/'; break;
                case 'photostore': url = '/photostore/'; break;
                case 'photoai': url = '/photoai/'; break;
                case 'ai-chat': url = '/ai-chat/'; break;
                default: return;
            }

            // Store token for the app to use (localStorage for cross-window sharing)
            localStorage.setItem('hubToken', token);

            // Navigate in current window/tab (opens in same tab)
            window.location.href = url;
        }

// Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            if (token && username) {
                showAppSelection(username);
            }
        });
    </script>
</body>
</html>
